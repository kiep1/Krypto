services:
  - type: web
    name: chartmentor-ai
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: APP_ORIGIN
        value: https://www.candletutor.com
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: OPENAI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        value: https://www.candletutor.com/auth/google/callback
      - key: PREMIUM_CONTENT_KEY
        sync: false
      - key: STRIPE_PAYMENT_LINK_URL
        value: https://buy.stripe.com/aFabJ1gcMdvv8AY7lGfnO01
      - key: STRIPE_PAYMENT_LINK_ID
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
